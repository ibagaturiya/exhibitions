name: Remove expired shows
on:
  schedule:
    - cron: '17 3 * * *'   # daily, 03:17 UTC
  push:                    # also whenever a show is published
    branches: [main]
    paths: ['shows/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency: cleanup
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: clean
        run: node cleanup.mjs
      # deleted files stay in git history: start main over as one commit so the space is freed,
      # after expired shows were removed here or a show was deleted from the viewer ("Remove show …").
      # The lease makes the push fail (and wait for tomorrow) if a show was published meanwhile.
      - if: steps.clean.outputs.removed != '0' || startsWith(github.event.head_commit.message, 'Remove show')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan fresh
          git add -A
          git commit -m "Remove expired shows (history cleared to free space)"
          git push --force-with-lease=main:${{ github.sha }} origin fresh:main
